# 三语言 CI：Rust 核心（fmt/clippy/测试/wasm）、Go 绑定、Python 绑定。
# tier3 全量金标（586K 例，需 release 编译）不在 CI 跑，属本地验证项。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --check
      - name: Clippy（零告警）
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试（常规层金标）
        run: cargo test
      - name: wasm 构建
        run: cargo build --release --target wasm32-wasip1
      - name: 上传 wasm 产物
        uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: target/wasm32-wasip1/release/x_iztro.wasm

  go:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Go 绑定金标测试（仓库内嵌 wasm）
        run: cd go/iztro && go test ./...
      - name: 下载源码新编的 wasm
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: go/iztro
      - name: Go 绑定金标测试（源码新编 wasm，防内嵌陈旧）
        run: cd go/iztro && go test ./...
      - name: Go 示例构建
        run: cd examples/go && go build .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 构建并安装 Python 绑定
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest
          maturin develop --features python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - name: Python 端到端金标测试
        run: .venv/bin/pytest python/tests/ -q
