# 三语言 CI：Rust 核心（fmt/clippy/测试/wasm）、Go 绑定、Python 绑定，外加文档站构建。
# tier3 全量金标（586K 例，需 release 编译）不在 CI 跑，属本地验证项。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --check
      - name: Clippy（零告警）
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试（常规层金标）
        run: cargo test
      - name: wasm 构建
        run: cargo build --release --target wasm32-wasip1
      - name: 上传 wasm 产物
        uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: target/wasm32-wasip1/release/x_iztro.wasm

  # 最低支持版本（Cargo.toml 的 rust-version）真能编译：防止代码用了更新的语法而声明没跟上。
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: MSRV 编译检查
        run: cargo check --all-targets

  go:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Go 绑定金标测试（仓库内嵌 wasm）
        run: cd go/iztro && go test ./...
      - name: 下载源码新编的 wasm
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: go/iztro
      - name: Go 绑定金标测试（源码新编 wasm，防内嵌陈旧）
        run: cd go/iztro && go test ./...
      - name: Go 示例构建
        run: cd examples/go && go build .

  # 两端各测一次：3.10 是 pyproject 声明的下限，也是 abi3 轮子的目标下限，
  # 语法与标准库用法一旦越界（如 3.11 才有的 StrEnum）只有它能拦住；
  # 3.12 代表当前主流。中间版本由 abi3 的兼容承诺覆盖。
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 构建并安装 Python 绑定
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest
          maturin develop --features python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - name: Python 端到端金标测试
        run: .venv/bin/pytest python/tests/ -q

  # 矩阵作业上报的检查名带版本号（python-tests (3.10) 等），分支保护没法按固定名
  # 等待它们；这个聚合门以固定名 python 汇总矩阵结果，矩阵扩缩不需要再动保护规则。
  python:
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - name: 矩阵全部通过
        run: echo "python matrix passed"

  # 文档站与三语言代码无依赖，独立跑。类型检查拦 MDX 组件用错，
  # 构建拦坏链接与坏 frontmatter——两者本地不跑就发现不了。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: 安装依赖
        run: cd docs && npm ci
      - name: 类型检查
        run: cd docs && npx next typegen && npm run types:check
      - name: 构建
        run: cd docs && npm run build
