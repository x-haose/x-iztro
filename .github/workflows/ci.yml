# 三语言 CI：Rust 核心（fmt/clippy/测试/wasm）、Go 绑定、Python 绑定，外加文档站构建。
# tier3 全量金标（586K 例，需 release 编译）不在 CI 跑，属本地验证项。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --check
      - name: Clippy（零告警）
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试（常规层金标）
        run: cargo test
      - name: wasm 构建
        run: cargo build --release --target wasm32-wasip1
      - name: 上传 wasm 产物
        uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: target/wasm32-wasip1/release/x_iztro.wasm

  go:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Go 绑定金标测试（仓库内嵌 wasm）
        run: cd go/iztro && go test ./...
      - name: 下载源码新编的 wasm
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: go/iztro
      - name: Go 绑定金标测试（源码新编 wasm，防内嵌陈旧）
        run: cd go/iztro && go test ./...
      - name: Go 示例构建
        run: cd examples/go && go build .

  # 两端各测一次：3.10 是 pyproject 声明的下限，也是 abi3 轮子的目标下限，
  # 语法与标准库用法一旦越界（如 3.11 才有的 StrEnum）只有它能拦住；
  # 3.12 代表当前主流。中间版本由 abi3 的兼容承诺覆盖。
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 构建并安装 Python 绑定
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest
          maturin develop --features python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - name: Python 端到端金标测试
        run: .venv/bin/pytest python/tests/ -q

  # 文档站与三语言代码无依赖，独立跑。类型检查拦 MDX 组件用错，
  # 构建拦坏链接与坏 frontmatter——两者本地不跑就发现不了。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: 安装依赖
        run: cd docs && npm ci
      - name: 类型检查
        run: cd docs && npx next typegen && npm run types:check
      - name: 构建
        run: cd docs && npm run build

  # 文档站部署：合并进 main 后把当前内容整站推到 Cloudflare Workers。
  # 不按 docs/ 路径过滤——部署是幂等的整站替换，省下一套「哪些文件算文档改动」的判断。
  # 开关是仓库变量 DOCS_DEPLOY=true：两个 secret 配好之前保持关闭，
  # 免得 main 上每次推送都红一格。
  docs-deploy:
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: 安装依赖
        run: cd docs && npm ci
      - name: 构建并部署
        run: cd docs && npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # robots.txt、sitemap.xml 与 hreflang 需要构建期就知道站点绝对地址
          NEXT_PUBLIC_SITE_URL: ${{ vars.DOCS_SITE_URL }}
