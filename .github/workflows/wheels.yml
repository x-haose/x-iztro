# Python wheel 多平台构建与发布。
#
# 触发有两条：
# - workflow_dispatch —— release.yml 发版时用 `--ref v<版本>` 派发到刚打的标签上，
#   此时 github.ref 是该标签，publish 作业成立；从分支手动触发则只构建不发布。
# - push tags v* —— 人工推标签时的直达路径（GITHUB_TOKEN 推的标签不会触发它，
#   所以自动发版走上面那条）。
#
# 发布采用 PyPI Trusted Publishing（OIDC，无需 API token）：
# 在 PyPI 项目设置 → Publishing 里登记本仓库的 wheels.yml 与 pypi 环境即可。
# 本工作流不能改成 reusable workflow 供 release.yml 直接 uses——
# PyPI 的可信发布匹配不到被复用的工作流（pypi/warehouse#11096 未关）。
name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 构建 wheel（abi3，一包通用 3.10+）
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python
          manylinux: auto
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 构建 sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # 不设 skip-existing：同一版本重复上传应当报错。
      # 静默跳过会让「版本号忘了改」这类事故看起来像发布成功。
      - name: 发布到 PyPI（Trusted Publishing）
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
