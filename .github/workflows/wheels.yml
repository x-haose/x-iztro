# Python wheel 多平台构建（wheels-build.yml）与发布。
#
# 触发有两条：
# - workflow_dispatch —— release.yml 发版时用 `--ref v<版本>` 派发到刚打的标签上，
#   此时 github.ref 是该标签，publish 作业成立；从分支手动触发则只构建不发布。
# - push tags v* —— 人工推标签时的直达路径（GITHUB_TOKEN 推的标签不会触发它，
#   所以自动发版走上面那条）。
#
# 发布采用 PyPI Trusted Publishing（OIDC，无需 API token）：
# 在 PyPI 项目设置 → Publishing 里登记本仓库的 wheels.yml 与 pypi 环境即可。
# 发布作业必须定义在本文件里，不能挪进被复用的工作流——
# PyPI 的可信发布匹配不到被复用的工作流（pypi/warehouse#11096 未关）。
name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/wheels-build.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # 跳过已上传的文件：release.yml 某步失败后重跑会再派发一次，已传过的 wheel 不能让它失败。
      # 「版本号忘了改」由 release.yml 开头按 PR 是否改了版本号拦下，不会走到这里。
      - name: 发布到 PyPI（Trusted Publishing）
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
