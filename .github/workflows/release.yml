# 合并到 main 即发版。
#
# 版本号的唯一来源是 Cargo.toml：PR 里改了它才发版，没改就跳过，
# 因此「合并一个普通 PR」与「发一个版本」用同一条路径，不必记两套流程。
#
# Release 描述取自 PR 正文的「## 发布说明」一节（见 pull_request_template.md），
# 不用 GitHub 自动生成的 PR 标题罗列——那个不成文案。
#
# 打出的 v* 标签会触发 wheels.yml，构建多平台 wheel 并发布到 PyPI。
# crates.io 目前仍需手动 cargo publish（仓库未配 token）。
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 取版本号，判断本次是否发版
        id: ver
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml 里读不到 [package] 的 version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version 已存在，本次 PR 未改版本号，跳过发版。"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "将发布 v$version。"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 从 PR 正文提取发布说明
        if: steps.ver.outputs.release == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | python3 .github/scripts/release_notes.py > RELEASE_NOTES.md

      - name: 打标签
        if: steps.ver.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: 建 Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file RELEASE_NOTES.md
