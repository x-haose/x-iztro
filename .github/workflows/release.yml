# 合并到 main 即发版。
#
# 版本号的唯一来源是 Cargo.toml：PR 里改了它才发版，没改就跳过，
# 因此「合并一个普通 PR」与「发一个版本」用同一条路径，不必记两套流程。
# pyproject.toml 与 js/package.json 的 version 必须与之相等，本作业开头断言，不等即失败——
# 三个文件各写一遍版本号，写漏一个会让 PyPI、npm 与 crates.io 发出不同版本。
#
# 「这个版本发完了」以 GitHub Release v<版本> 存在为准，它在全部发布之后最后建。
# 其余每一步都是「已完成即跳过」：crates.io、npm 查注册表里有没有这个版本，标签查有没有，
# PyPI 由 wheels.yml 按文件跳过已上传的。任何一步失败后修好原因、重跑本作业，
# 已完成的步骤跳过，从失败处接着做。
#
# Release 描述取自 PR 正文的「## 发布说明」一节（见 pull_request_template.md），
# 不用 GitHub 自动生成的 PR 标题罗列——那个不成文案。
#
# crates.io、npm 与 PyPI 都走可信发布（OIDC 换短期令牌），仓库里不存任何长期凭据。
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  # crates.io 与 npm 的可信发布要用 GitHub 签发的 OIDC JWT 去换短期令牌
  id-token: write
  # 末尾 gh workflow run 派发 wheels.yml 要写 Actions
  actions: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 取版本号，判断本次是否发版
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          toml_version() {
            sed -n "/^\[$2\]/,/^\[/p" "$1" \
              | sed -n 's/^version = "\(.*\)"/\1/p' | head -1
          }
          version=$(toml_version Cargo.toml package)
          py_version=$(toml_version pyproject.toml project)
          js_version=$(jq -r .version js/package.json)
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml 里读不到 [package] 的 version"
            exit 1
          fi
          if [ "$version" != "$py_version" ] || [ "$version" != "$js_version" ]; then
            echo "::error::版本号不一致：Cargo.toml=$version，pyproject.toml=${py_version:-空}，js/package.json=${js_version:-空}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version 已存在，本次 PR 未改版本号，跳过发版。"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "将发布 v$version（已完成的步骤会跳过）。"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # 发版门禁：金标测试不过就不该有这个版本。
      # tier3 全量（586K 例）留在本地，常规层已覆盖排盘、运限、契约与 i18n。
      - name: 装 Rust 工具链
        if: steps.ver.outputs.release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: 常规层金标测试
        if: steps.ver.outputs.release == 'true'
        run: cargo test --locked

      # npm 可信发布要求 npm 11.5.1 以上、Node 22.14.0 以上（docs.npmjs.com/trusted-publishers，2026-11-23 查）；
      # Node 26 自带 npm 11.20。不配 registry-url：它会写入 NODE_AUTH_TOKEN 配置，盖过 OIDC。
      # 发布用的包缓存可能被投毒，故不开 npm 缓存。
      - name: 装 Node.js
        if: steps.ver.outputs.release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      # JS 包的门禁与产物在同一步：构建出的 dist/ 就是随后发布的内容。
      - name: JS 绑定构建与测试
        if: steps.ver.outputs.release == 'true'
        run: |
          cd js
          npm ci
          npm run check

      # 发布前的预检：npm 可信发布只能给已存在的包配置，包还不存在时 OIDC 发布必然失败。
      # 在发布任何东西之前确认，免得 crates.io 已发出而 npm 发不出去。
      # 首次发布与可信发布的登记要维护者在 npmjs.com 手动做，见 CLAUDE.md「发版」。
      - name: 预检 npm 包已存在
        if: steps.ver.outputs.release == 'true'
        run: |
          if ! npm view x-iztro name >/dev/null 2>&1; then
            echo "::error::npm 上还没有 x-iztro 包：可信发布要求包已存在，先由维护者手动首发并登记 Trusted Publisher（见 CLAUDE.md「发版」）"
            exit 1
          fi

      - name: 查 crates.io 是否已有这个版本
        if: steps.ver.outputs.release == 'true'
        id: crates
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'x-iztro-release (github.com/x-haose/x-iztro)' \
            "https://crates.io/api/v1/crates/x-iztro/$VERSION")
          case "$status" in
            200) echo "x-iztro $VERSION 已在 crates.io，跳过。"; echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::查询 crates.io 返回 HTTP $status"; exit 1 ;;
          esac

      - name: 换取 crates.io 短期令牌
        if: steps.ver.outputs.release == 'true' && steps.crates.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: 发布到 crates.io
        if: steps.ver.outputs.release == 'true' && steps.crates.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      # 版本不存在时 npm view 输出为空，与网络失败区分开：只有输出恰为这个版本号才算已发布
      - name: 发布到 npm
        if: steps.ver.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd js
          if [ "$(npm view "x-iztro@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "x-iztro@$VERSION 已在 npm，跳过。"
          else
            npm publish --access public
          fi

      # 两个标签：v* 是仓库版本，go/iztro/v* 是 Go 子模块版本。
      # Go 的模块路径带子目录（.../x-iztro/go/iztro），go get 只认前缀相同的标签，
      # 少了它 go get 拿不到这个版本。
      - name: 打标签
        if: steps.ver.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in "v$VERSION" "go/iztro/v$VERSION"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag 已存在，跳过。"
            else
              git tag -a "$tag" -m "$tag"
              git push origin "$tag"
            fi
          done

      # PyPI 由 wheels.yml 接手，用 workflow_dispatch 显式派发到刚打的标签上。
      # 不能直接让推标签去触发：GITHUB_TOKEN 推出的 push 事件不会启动新的工作流运行，
      # workflow_dispatch 是该规则的明文例外。
      # 也不能把 wheels.yml 写成 reusable workflow 由本作业 uses 调用：
      # PyPI 可信发布匹配不到被复用工作流（pypi/warehouse#11096 未关），一调即拒。
      - name: 派发 wheels.yml 构建并发布 PyPI
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: gh workflow run wheels.yml --ref "v$VERSION"

      # 最后建 Release：它的存在表示这个版本的全部发布步骤都已完成（见文件开头）。
      - name: 从 PR 正文提取发布说明
        if: steps.ver.outputs.release == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | python3 .github/scripts/release_notes.py > RELEASE_NOTES.md

      - name: 建 Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file RELEASE_NOTES.md
