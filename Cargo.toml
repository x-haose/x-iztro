[package]
name = "x-iztro"
version = "0.3.0"
edition = "2024"
# 摘要用英文：crates.io 的搜索与列表面向的是国际读者，中文说明在 README 里。
description = "Zi Wei Dou Shu (Purple Star Astrology) chart engine, field-for-field identical to iztro"
license = "MIT"
repository = "https://github.com/x-haose/x-iztro"
homepage = "https://ziwei.x-haose.com"
documentation = "https://ziwei.x-haose.com/en/docs/rust"
readme = "README.md"
keywords = ["ziwei", "iztro", "astrology", "horoscope", "chinese"]
categories = ["date-and-time", "science"]
# let-chains 语法的下限；写明后低版本工具链报的是「需要 1.88」而不是一串语法错误
rust-version = "1.88"
# crates.io 发布只含核心库（金标数据与各语言绑定包不随 crate 分发）。
# 路径一律加前导斜杠锚到仓库根：include 用的是 gitignore 语义，
# 不带斜杠的 README.md 会匹配任意层级，把 docs/node_modules 下的同名文件一并吸进来。
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/include/*.h"]

[lib]
name = "x_iztro"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lunar_rust = "1.0"
# 仅 horoscope_now 用到本地时钟；lunar_rust 已依赖 chrono，不引入额外编译体积
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dependencies.pyo3]
version = "0.23"
features = ["extension-module", "abi3-py310"]
optional = true

[dependencies.pythonize]
version = "0.23"
optional = true

[features]
python = ["pyo3", "pythonize"]

[dev-dependencies]
pretty_assertions = "1"
sha2 = "0.10"
hex = "0.4"
