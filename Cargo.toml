[package]
name = "x-iztro"
version = "0.1.0"
edition = "2024"
description = "紫微斗数排盘核心库：100% 对齐 iztro，支持 Rust / Python / Go 调用"
license = "MIT"
repository = "https://github.com/x-haose/x-iztro"
readme = "README.md"
keywords = ["ziwei", "iztro", "astrology", "horoscope", "chinese"]
categories = ["date-and-time", "science"]
# crates.io 发布只含核心库（金标数据与各语言绑定包不随 crate 分发）
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "include/*.h"]

[lib]
name = "x_iztro"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lunar_rust = "1.0"

[dependencies.pyo3]
version = "0.23"
features = ["extension-module"]
optional = true

[dependencies.pythonize]
version = "0.23"
optional = true

[features]
python = ["pyo3", "pythonize"]

[dev-dependencies]
pretty_assertions = "1"
sha2 = "0.10"
hex = "0.4"
