[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "x-iztro"
version = "0.5.0"
description = "Zi Wei Dou Shu (Purple Star Astrology) chart engine, field-for-field identical to iztro"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "昊色居士", email = "xhrtxh@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ziwei", "iztro", "astrology", "horoscope", "紫微斗数"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Natural Language :: Chinese (Simplified)",
]

[project.urls]
Homepage = "https://github.com/x-haose/x-iztro"
Repository = "https://github.com/x-haose/x-iztro"
Documentation = "https://ziwei.x-haose.com/en/docs/python"
Issues = "https://github.com/x-haose/x-iztro/issues"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "x_iztro._x_iztro"
